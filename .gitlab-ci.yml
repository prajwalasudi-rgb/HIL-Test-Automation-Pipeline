# HIL test automation pipeline - two pipeline types in one project
#
# 1. Preparation pipeline (TEST_TASK = "Preparation", default)
#      started by the folder watcher / a schedule when new software lands in
#      <share>/CT_in/<ECU>/: prepares a workspace per ECU, writes jobs, then
#      queues them - each queued job triggers ...
# 2. Execution pipeline (TEST_TASK = "Execution")
#      ... one pipeline per job, routed by tag to the HIL bench of that ECU:
#      flash the ECU, run the tests only if flashing succeeded, publish results.
#
# Demo jobs run on any Docker runner with the mock tool backend and a share
# inside the build folder. On real benches: register a runner on each Windows
# HIL PC (shell executor, tags e.g. [hil, HIL-1]), point HIL_SHARE at the
# network share and set HIL_TOOL_BACKEND=dspace.

variables:
  TEST_TASK: "Preparation"
  HIL_SHARE: "build/share"
  HIL_TOOL_BACKEND: "mock"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.11-slim
  cache:
    paths: [.cache/pip]
  before_script:
    - pip install -q -r requirements.txt

stages: [check, prepare, queue, execute]

# ---------------------------------------------------------------- checks --
unit_tests:
  stage: check
  rules:
    - if: $TEST_TASK == "Preparation"
  script:
    - pip install -q pytest
    - python -m pytest -q

# ------------------------------------------------- preparation pipeline --
prepare:
  stage: prepare
  rules:
    - if: $TEST_TASK == "Preparation"
  script:
    # demo only: create a share with three software drops (real setup: network share)
    - python -c "from pathlib import Path; from hil_pipeline import orchestrator as o; o.create_demo_share(Path('$HIL_SHARE'), Path('examples'))"
    - python -m hil_pipeline prepare $HIL_SHARE
    - python -m hil_pipeline status $HIL_SHARE
  artifacts:
    paths: [build/]

queue:
  stage: queue
  rules:
    - if: $TEST_TASK == "Preparation"
  script:
    # with GITLAB_TRIGGER_TOKEN set (CI/CD variable), each job becomes its own
    # execution pipeline; without it the demo executes the jobs right here
    - |
      if [ -n "$GITLAB_TRIGGER_TOKEN" ]; then
        export GITLAB_URL=$CI_SERVER_URL GITLAB_PROJECT=$CI_PROJECT_ID GITLAB_REF=$CI_COMMIT_REF_NAME
        python -m hil_pipeline queue $HIL_SHARE --mode gitlab
      else
        python -m hil_pipeline queue $HIL_SHARE --mode local
      fi
    - python -m hil_pipeline status $HIL_SHARE
  artifacts:
    when: always
    paths: [build/]
    reports:
      junit: build/share/CT_out/*/*/results/junit.xml

# --------------------------------------------------- execution pipeline --
execute:
  stage: execute
  rules:
    - if: $TEST_TASK == "Execution"
  # real benches: route the job to the right HIL PC
  # tags: [hil, $HIL]
  script:
    - python -m hil_pipeline execute $HIL_SHARE --job $JOB_ID
  artifacts:
    when: always
    paths: [$HIL_SHARE/CT_out/]
    reports:
      junit: $HIL_SHARE/CT_out/*/*/results/junit.xml

# A later release that contains a regression: the vehicle-speed message is
# sent too slowly and the coolant temperature is reported out of range.
# The pipeline should catch both and fail.
ecu: ECU_DEMO
version: 1.1.0
dbc: ecu.dbc
binary: ECU_DEMO_v1.1.0.hex     # not included in the demo
test_config:
  duration_s: 4.0
  cycle_time_tolerance: 0.10
sim_faults:
  - type: slow_cycle
    message: CCVS_Demo
    factor: 1.3                 # sent every 130 ms instead of 100 ms
  - type: out_of_range
    signal: EngineCoolantTemp
    raw_value: 255              # 255 - 40 = 215 degC, above the 210 degC limit
